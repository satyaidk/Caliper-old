name: CI

# Every push and every pull request on the two long-lived branches. dev is
# where work lands; main is what gets deployed.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Node's own runner, so there is no framework to install and nothing to
      # keep in step with the build.
      - name: Unit tests
        run: npm test

      # Every text colour against every surface it sits on, in both themes.
      - name: Contrast
        run: npm run contrast

      - name: Build
        run: npm run build

      # Kept for 7 days so a failed deploy can be compared against the artifact
      # CI actually produced, rather than a rebuild that might differ.
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7
