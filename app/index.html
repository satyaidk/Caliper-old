<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: pinch-zoom is how a lot of people read a screen, and
         locking it out to stop an input focus jump is not a trade worth making. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- The top bar is Bambu slate in both themes, so the browser chrome is too. -->
    <meta name="theme-color" content="#262e30" />

    <!-- Stamp the theme before first paint so a light-mode visitor never sees a
         dark flash. Must agree with initialTheme() in store/useViewer.ts. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('caliper.theme');
          document.documentElement.dataset.theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
        } catch (e) {
          /* keep the markup default */
        }
      })();
    </script>

    <title>Caliper — 3D model viewer</title>
    <meta
      name="description"
      content="Open STEP, STL, 3MF, IFC, glTF and 17 more formats in the browser. Measure distances, diameters and angles, check printability, and preview layers. Nothing is uploaded."
    />
    <link rel="canonical" href="https://caliper.app/app/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Caliper renders models with WebGL and needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
